name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lib:
    name: lib (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The example app is an npm workspace, so one install covers root and example.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  host-proof:
    name: host-proof (next build + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace examples/next-app
      - run: npx playwright install --with-deps chromium
      - run: node scripts/host-proof.mjs
